<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="عجلة الفخامة — عجلة تفاعلية لاختيار اسم أو خيار عشوائي." />
  <meta id="themeColorMeta" name="theme-color" content="#f2f5fb" />
  <title>عجلة الفخامة — اختيار عشوائي</title>
  <link rel="icon" type="image/png" href="logo.png" />

  <!-- Set the theme before CSS paints to avoid a flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("wheel.theme.v2");
        document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="bg-orb bg-orb--one" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--two" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <img src="logo.png" alt="" width="512" height="512" decoding="async" />
        </span>
        <div class="brand__text">
          <h1>عجلة الفخامة<span class="brand__dot">.</span></h1>
        </div>
      </div>

      <div class="topbar__actions">
        <button id="soundToggle" class="icon-btn" type="button" aria-pressed="true" aria-label="إيقاف الصوت" title="إيقاف الصوت" data-sound="on">
          <svg class="icon icon--sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5Z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            <path d="M18.5 5.5a9 9 0 0 1 0 13" />
          </svg>
          <svg class="icon icon--sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5Z" />
            <path d="m16 9 6 6" />
            <path d="m22 9-6 6" />
          </svg>
        </button>

        <button id="themeToggle" class="icon-btn" type="button" aria-label="التبديل إلى الوضع الداكن" title="التبديل إلى الوضع الداكن">
          <svg class="icon icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <div class="wheel-column">
        <section id="wheelCard" class="card wheel-card" aria-label="العجلة">
          <div class="wheel-stage" id="wheelStage">
            <div class="pointer" id="pointer" aria-hidden="true">
              <span class="pointer__cap"></span>
              <span class="pointer__tip"></span>
            </div>

            <div class="wheel-visual">
              <canvas id="wheel" role="img" aria-label="عجلة فخامة ملونة. اضغط للتدوير."></canvas>

              <div class="empty-state" id="emptyState" hidden>
                <div class="empty-state__inner">
                  <span class="empty-state__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="9" />
                      <path d="M12 8v8M8 12h8" />
                    </svg>
                  </span>
                  <strong>العجلة فارغة</strong>
                  <p>أضف عنصراً واحداً على الأقل من القائمة لتبدأ.</p>
                  <button id="emptyAddBtn" class="btn btn--ghost btn--sm" type="button">إضافة عناصر</button>
                </div>
              </div>

              <button class="hub" id="hub" type="button" aria-label="تدوير العجلة">
                <span class="hub__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-3.5-7.1" />
                    <path d="M21 3v6h-6" />
                  </svg>
                </span>
                <span class="hub__label">تدوير</span>
                <span class="hub__count" id="hubCount">12</span>
              </button>
            </div>
          </div>

          <div class="wheel-actions">
            <button id="spinBtn" class="btn btn--primary btn--lg" type="button" aria-label="تدوير العجلة">
              <span class="btn__spinner" aria-hidden="true"></span>
              <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-3.5-7.1" />
                <path d="M21 3v6h-6" />
              </svg>
              <span class="btn__label">تدوير العجلة</span>
            </button>
          </div>

          <div class="last-result" id="lastResult" hidden>
            <span class="last-result__dot" id="lastResultDot" aria-hidden="true"></span>
            <span>آخر فائز:</span>
            <strong id="lastResultName"></strong>
            <video
              class="last-result__emoji"
              id="lastResultEmoji"
              src="winner-emoji.webm"
              width="100"
              height="100"
              loop
              muted
              playsinline
              preload="auto"
              aria-hidden="true"
              tabindex="-1"
            ></video>
          </div>
        </section>

        <p class="developer-credit">
          <span>تم التطوير By مجتبى</span>
          <img src="verified.png" alt="" width="512" height="512" decoding="async" />
        </p>
      </div>

      <aside class="card editor-card" aria-label="قائمة العناصر">
        <div class="card__head">
          <p class="eyebrow eyebrow--card">قائمتك</p>
          <span class="count-badge" id="countBadge" aria-live="polite">12 عنصراً</span>
        </div>

        <label class="field-label" for="entries">
          <span>العناصر</span>
        </label>
        <textarea id="entries" class="entries-input" spellcheck="false" autocomplete="off" placeholder="اكتب كل اسم في سطر منفصل…"></textarea>

        <div class="editor-toolbar">
          <button id="shuffleBtn" class="btn btn--ghost" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 3h5v5" />
              <path d="M4 20 21 3" />
              <path d="M21 16v5h-5" />
              <path d="m15 15 6 6" />
              <path d="m4 4 5 5" />
            </svg>
            <span class="btn__label">خلط</span>
          </button>
          <button id="sortBtn" class="btn btn--ghost" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18M6 12h12M10 18h4" />
            </svg>
            <span class="btn__label">ترتيب</span>
          </button>
          <button id="clearBtn" class="btn btn--ghost btn--danger-ghost" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
            </svg>
            <span class="btn__label">مسح</span>
          </button>
          <button id="saveNamesBtn" class="btn btn--ghost btn--wide" type="button" title="حفظ القائمة الحالية في هذا المتصفح">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
              <path d="M17 21v-8H7v8" />
              <path d="M7 3v5h8" />
            </svg>
            <span class="btn__label">حفظ الأسماء</span>
          </button>
          <button id="restoreNamesBtn" class="btn btn--ghost btn--wide" type="button" title="استعادة الأسماء المحفوظة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 4v6h6" />
              <path d="M3.5 15a9 9 0 1 0 2.6-9.9L3 10" />
            </svg>
            <span class="btn__label">استعادة الأسماء</span>
          </button>
          <button id="speedBtn" class="btn btn--ghost btn--full" type="button" title="سرعة الدوران: 6 من 10">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2" />
              <circle cx="16" cy="6" r="2" />
              <circle cx="10" cy="12" r="2" />
              <circle cx="16" cy="18" r="2" />
            </svg>
            <span class="btn__label">إعدادات السرعة</span>
          </button>
        </div>

        <ul id="entriesList" class="entries-list" aria-label="عناصر العجلة"></ul>
      </aside>
    </main>
  </div>

  <div class="modal" id="winnerModal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__card" id="winnerCard" role="dialog" aria-modal="true" aria-labelledby="winnerName">
      <button class="modal__close" id="modalCloseIcon" type="button" data-close-modal aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>

      <p class="eyebrow">الفائز هو</p>

      <div class="winner-stage" id="winnerStage">
        <span class="winner-stage__glow" aria-hidden="true"></span>
        <div class="fire-wrapper">
          <h2 class="winner-name" id="winnerName"></h2>
          <div class="fire-sparks" aria-hidden="true">
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
            <span class="spark"></span>
          </div>
        </div>
      </div>

      <div class="modal__actions">
        <button id="closeModalBtn" class="btn btn--primary" type="button">إغلاق</button>
      </div>
    </div>
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  </div>

  <div class="modal" id="speedModal" hidden>
    <div class="modal__backdrop" data-close-speed></div>
    <div class="modal__card modal__card--speed" role="dialog" aria-modal="true" aria-labelledby="speedTitle">
      <button class="modal__close" type="button" data-close-speed aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>

      <p class="eyebrow">الإعدادات</p>
      <h2 class="speed-title" id="speedTitle">سرعة الدوران</h2>

      <div class="speed-value" aria-hidden="true">
        <strong id="speedValue">6</strong>
        <span>/ 10</span>
      </div>

      <div class="speed-slider">
        <input
          id="speedRange"
          class="speed-range"
          type="range"
          min="0"
          max="10"
          step="1"
          value="6"
          aria-label="سرعة دوران العجلة"
          aria-valuetext="6 من 10"
        />
      </div>
      <div class="speed-scale" aria-hidden="true">
        <span>أبطأ</span>
        <span>أسرع</span>
      </div>

      <div class="modal__actions">
        <button id="closeSpeedBtn" class="btn btn--primary" type="button" data-close-speed>تم</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
