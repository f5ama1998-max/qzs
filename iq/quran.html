<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم والختمة - 1961</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101820;
  color: white;
  text-align: center;
  padding: 15px;
  line-height: 2;
}
.card {
  max-width: 800px;
  margin: auto;
  padding: 20px;
  border: 1px solid #c9a646;
  border-radius: 16px;
  background: #1b2835;
}
select, button {
  padding: 10px;
  margin: 6px;
  font-size: 16px;
  border-radius: 8px;
}
button {
  cursor: pointer;
}
.ayah {
  font-size: 23px;
  line-height: 2.2;
  margin: 15px 0;
  color: #f5e7b2;
}
a { color: #e4c66b; }
</style>
</head>
<body>
<div class="card">
  <h1>📖 القرآن الكريم</h1>
  <p>قراءة القرآن الكريم ومتابعة الختمة</p>

  <label for="surah">اختار السورة:</label>
  <select id="surah"></select>

  <div id="status">جاري تحميل القرآن الكريم...</div>
  <div id="verses"></div>

  <button onclick="previousSurah()">السورة السابقة</button>
  <button onclick="nextSurah()">السورة التالية</button>
  <button onclick="saveProgress()">حفظ تقدّم الختمة</button>

  <p id="progress"></p>
  <p>رحم الله أبي، وجعل القرآن نورًا له.</p>
  <a href="index.html">العودة إلى صفحة 1961</a>
</div>

<script>
let surahs = [];
let currentSurah = 1;
let savedAyah = 1;

const select = document.getElementById("surah");
const statusBox = document.getElementById("status");
const versesBox = document.getElementById("verses");
const progressBox = document.getElementById("progress");

async function loadQuran() {
  try {
    const response = await fetch(
      "https://api.alquran.cloud/v1/surah"
    );
    if (!response.ok) throw new Error("تعذر الاتصال");
    const result = await response.json();
    surahs = result.data;

    surahs.forEach(s => {
      const option = document.createElement("option");
      option.value = s.number;
      option.textContent = s.number + " - " + s.name;
      select.appendChild(option);
    });

    savedAyah = Number(localStorage.getItem("quranAyah") || 1);
    currentSurah = Number(localStorage.getItem("quranSurah") || 1);
    select.value = currentSurah;
    await loadSurah(currentSurah);
  } catch (error) {
    statusBox.textContent =
      "تعذر تحميل القرآن. تأكد من اتصال الإنترنت ثم حدّث الصفحة.";
  }
}

async function loadSurah(number) {
  currentSurah = Number(number);
  versesBox.textContent = "";
  statusBox.textContent = "جاري تحميل السورة...";
  try {
    const response = await fetch(
      "https://api.alquran.cloud/v1/surah/" + currentSurah
    );
    if (!response.ok) throw new Error("تعذر التحميل");
    const result = await response.json();
    const surah = result.data;

    statusBox.textContent =
      surah.name + " — عدد الآيات: " + surah.numberOfAyahs;

    surah.ayahs.forEach(ayah => {
      const p = document.createElement("p");
      p.className = "ayah";
      p.textContent = ayah.text + " ۞ ";
      versesBox.appendChild(p);
    });
    updateProgress();
  } catch (error) {
    statusBox.textContent = "ما قدرنا نحمل السورة. جرّب تحديث الصفحة.";
  }
}

select.addEventListener("change", () => loadSurah(select.value));

function saveProgress() {
  localStorage.setItem("quranSurah", currentSurah);
  localStorage.setItem("quranAyah", savedAyah);
  progressBox.textContent =
    "تم حفظ تقدّمك عند السورة رقم " + currentSurah +
    " والآية رقم " + savedAyah;
}

function updateProgress() {
  progressBox.textContent =
    "السورة الحالية: " + currentSurah +
    " — آخر آية محفوظة: " + savedAyah;
}

function nextSurah() {
  if (currentSurah < 114) {
    currentSurah++;
    select.value = currentSurah;
    loadSurah(currentSurah);
  }
}

function previousSurah() {
  if (currentSurah > 1) {
    currentSurah--;
    select.value = currentSurah;
    loadSurah(currentSurah);
  }
}

loadQuran();
</script>
</body>
</html>
